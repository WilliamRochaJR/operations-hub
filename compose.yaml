name: operations-hub

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: operations_hub
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations_hub"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  orders-service:
    build: ./microservices/orders-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/operations_hub
      DATABASE_USER: operations
      DATABASE_PASSWORD: operations
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  audit-service:
    build: ./microservices/audit-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/operations_hub
      DATABASE_USER: operations
      DATABASE_PASSWORD: operations
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      ORDERS_SERVICE_URL: http://orders-service:8081
      AUDIT_SERVICE_URL: http://audit-service:8082
      WEB_ORIGIN: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      orders-service: { condition: service_healthy }
      audit-service: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    ports: ["8080:8080"]
    depends_on: [bff]

volumes:
  postgres-data:
