server:
  port: ${PORT:8082}
spring:
  application:
    name: audit-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/operations_hub}
    username: ${DATABASE_USER:operations}
    password: ${DATABASE_PASSWORD:operations}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: audit
  flyway:
    default-schema: audit
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  kafka:
    orders-topic: orders.events.v1
