{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "operations-hub.labels" $ | nindent 4 }}
spec:
  replicas: {{ $component.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "operations-hub.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $component.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: {{ $component.healthPath }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $component.healthPath }}, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- if or (eq $name "bff") (hasSuffix "-service" $name) }}
          envFrom:
            - configMapRef: { name: operations-hub-config }
          {{- end }}
          {{- if hasSuffix "-service" $name }}
          env:
            {{- if eq $.Values.kafka.authentication "iam" }}
            - name: SPRING_PROFILES_ACTIVE
              value: aws
            {{- end }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef: { name: {{ $.Values.database.secretName }}, key: {{ $.Values.database.usernameKey }} }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.database.secretName }}, key: {{ $.Values.database.passwordKey }} }
          {{- end }}
{{- end }}
